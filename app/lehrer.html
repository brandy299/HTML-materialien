<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Lernraum · Ergebnisse einlesen</title>
<style>
  :root { --ink:#1E1E1E; --paper:#FBF8F2; --pink:#F386A1; --ok:#117a4d; --bad:#c0262d; --line:#1E1E1E; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.45 system-ui,-apple-system,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:26px; line-height:1.15; margin:8px 0 6px; }
  p.hint { font-size:14px; color:#444; margin:0 0 16px; }
  label { display:block; font-weight:700; margin:16px 0 6px; }
  textarea, input { width:100%; font:14px/1.4 ui-monospace,Menlo,monospace; border:2px solid var(--line); background:#fff; padding:10px; border-radius:0; }
  textarea { min-height:140px; }
  button { min-height:48px; padding:0 18px; font:700 15px system-ui; border:2px solid var(--line); background:var(--pink); color:var(--ink); cursor:pointer; margin:14px 10px 0 0; }
  button.ghost { background:#fff; }
  .scroll { overflow-x:auto; margin-top:18px; border:2px solid var(--line); background:#fff; }
  table { border-collapse:collapse; width:100%; min-width:520px; font-size:14px; }
  th, td { padding:9px 10px; border-bottom:1px solid #ddd; text-align:left; white-space:nowrap; }
  th { background:var(--ink); color:var(--paper); }
  .ok { color:var(--ok); font-weight:700; } .bad { color:var(--bad); font-weight:700; }
  .note { font-size:13px; color:#555; margin-top:14px; }
</style>
</head>
<body>
<main>
  <h1>Ergebnisse einlesen</h1>
  <p class="hint">Alles läuft nur in diesem Browser. Es wird nichts hochgeladen und nichts gespeichert.</p>
  <label for="pin">Klassen-PIN</label>
  <input id="pin" inputmode="numeric" autocomplete="off" placeholder="die PIN, die du der Klasse genannt hast">
  <label for="codes">Ergebnis-Codes (einer pro Zeile)</label>
  <textarea id="codes" placeholder="LA1.…"></textarea>
  <button id="go">Auswerten</button><button id="csv" class="ghost" disabled>Als CSV speichern</button>
  <div id="out"></div>
  <p class="note">Die Prüfsumme erkennt Tippfehler und falsche PIN, schützt aber nicht vor gezielter Fälschung. Gib die Note nur nach Aufsicht in der Stunde. Die Zuordnung Kürzel ↔ Name bleibt bei dir.</p>
</main>
<script>
(() => {
  const GRADING = [[87,"1"],[73,"2"],[59,"3"],[45,"4"],[18,"5"],[0,"6"]];   // Notenschlüssel Handelsschule
  const $ = (id) => document.getElementById(id);
  const b64uToBytes = (t) => Uint8Array.from(atob(t.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
  const esc = (x) => String(x).replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const fmt = (x) => String(x).replace(".", ",");
  let rows = [];
  async function check(line, pin) {
    const m = line.trim().match(/^LA1\.([A-Za-z0-9_-]+)\.([0-9a-f]{10})$/);
    if (!m) return { err: "Format" };
    const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
    const sig = new Uint8Array(await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(m[1])));
    const hex = [...sig.slice(0, 5)].map((b) => b.toString(16).padStart(2, "0")).join("");
    let d;
    try { d = JSON.parse(new TextDecoder().decode(b64uToBytes(m[1]))); } catch { return { err: "Format" }; }
    if (hex !== m[2]) return { err: "Prüfsumme falsch", d };
    return { d };
  }
  $("go").onclick = async () => {
    const pin = $("pin").value.trim();
    const lines = $("codes").value.split(/\n+/).map((x) => x.trim()).filter(Boolean);
    const seen = new Set();
    rows = [];
    for (const line of lines) {
      const r = await check(line, pin);
      const d = r.d || {};
      const id = [d.a, d.t, d.n, d.d].join("|");
      let status = r.err || "gültig";
      if (!r.err) { if (seen.has(id)) status = "doppelt"; seen.add(id); }
      const pct = d.m ? d.p / d.m * 100 : 0;
      rows.push({ a: d.a || "?", t: d.t || "?", p: d.p, m: d.m, pct, note: d.m ? GRADING.find(([min]) => pct >= min)[1] : "–", s: d.s, d: d.d || "", status });
    }
    rows.sort((x, y) => String(x.a).localeCompare(String(y.a), "de"));
    $("out").innerHTML = rows.length ? `<div class="scroll"><table><thead><tr><th>Kürzel</th><th>Test</th><th>Punkte</th><th>%</th><th>Note</th><th>Zeit</th><th>Datum</th><th>Status</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${esc(r.a)}</td><td>${esc(r.t)}</td><td>${r.p === undefined ? "–" : fmt(r.p) + "/" + r.m}</td><td>${Math.round(r.pct)}</td><td>${esc(r.note)}</td><td>${r.s === undefined ? "–" : Math.floor(r.s / 60) + ":" + String(r.s % 60).padStart(2, "0")}</td><td>${esc(r.d)}</td><td class="${r.status === "gültig" ? "ok" : "bad"}">${esc(r.status)}</td></tr>`).join("")}</tbody></table></div>` : "";
    $("csv").disabled = !rows.length;
  };
  $("csv").onclick = () => {
    const q = (x) => `"${String(x).replace(/"/g, '""')}"`;
    const csv = "﻿" + [["Kürzel","Test","Punkte","Max","Prozent","Note","Sekunden","Datum","Status"], ...rows.map((r) => [r.a, r.t, r.p ?? "", r.m ?? "", Math.round(r.pct), r.note, r.s ?? "", r.d, r.status])].map((r) => r.map(q).join(";")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = "ergebnisse-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.append(a); a.click(); a.remove();
  };
})();
</script>
</body>
</html>
