name: quiz-sync

# Spiegelt das Live-Quiz aus brandy299/lernraum-quiz (öffentlich) nach quiz/ (lernen.yannikbrand.eu/quiz/),
# weil quiz.yannikbrand.eu im Schulnetz gesperrt sein kann. Es wird ein Pull Request geöffnet, nichts landet ungeprüft auf main.
# Voraussetzung: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quiz-Repo holen
        run: git clone --depth 1 https://github.com/brandy299/lernraum-quiz.git "$RUNNER_TEMP/quiz-src"
      - name: Dateien nach quiz/ kopieren
        run: |
          set -e
          src="$RUNNER_TEMP/quiz-src"
          for f in quiz.js race.js quiz.css config.js; do cp "$src/$f" "quiz/$f"; done
          [ -f "$src/game.js" ] && cp "$src/game.js" quiz/game.js || rm -f quiz/game.js
          # index.html: Design liegt hier unter ../app/ statt assets/
          sed -e 's#href="assets/icon.svg"#href="../app/icon.svg"#' \
              -e 's#href="assets/icon-180.png"#href="../app/icon-180.png"#' \
              -e 's#href="assets/fonts/#href="../app/fonts/#g' \
              -e 's#href="assets/styles.css#href="../app/styles.css#' \
              -e 's#src="assets/qrcode.js#src="../app/vendor/qrcode.js#' \
              "$src/index.html" > quiz/index.html
          if grep -q 'assets/' quiz/index.html; then echo "Unbekannter assets-Pfad in index.html, Abbruch"; exit 1; fi
          node --check quiz/quiz.js && node --check quiz/race.js
          [ -f quiz/game.js ] && node --check quiz/game.js || true
          echo "SRC_SHA=$(git -C "$src" rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Pull Request öffnen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ -z "$(git status --porcelain quiz)" ]; then echo "Keine Änderungen."; exit 0; fi
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B quiz-sync
          git add quiz
          git commit -m "Live-Quiz: Stand von lernraum-quiz übernehmen ($SRC_SHA)"
          git push -f origin quiz-sync
          if [ -z "$(gh pr list --head quiz-sync --state open --json number -q '.[].number')" ]; then
            gh pr create --head quiz-sync --base main \
              --title "Live-Quiz: Spiegel von lernraum-quiz aktualisieren" \
              --body "Automatisch aus https://github.com/brandy299/lernraum-quiz (Stand $SRC_SHA) übernommen, damit das Quiz auch unter lernen.yannikbrand.eu/quiz/ läuft. Bitte Änderungen kurz ansehen und mergen. Kein SQL (Datenbank-Änderungen steht im Quiz-Repo in supabase/quiz.sql und muss dort eingespielt werden)."
          fi
